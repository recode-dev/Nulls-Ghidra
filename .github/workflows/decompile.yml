name: decompile

on:
  workflow_dispatch:
    inputs:
      url:
        description: ipa url override
        default: ''
      symbolize:
        description: generate IDA/Ghidra/r2 symbol maps
        type: boolean
        default: true
      extract_all:
        description: extract strings, xrefs, and call graphs
        type: boolean
        default: true
      fingerprint:
        description: extract structural fingerprints
        type: boolean
        default: true
      reconstruct_classes:
        description: reconstruct C++ classes
        type: boolean
        default: true
      seconds:
        description: total seconds for analyze + dump
        default: '18000'
  push:
    branches: [main]
    paths:
      - '.github/workflows/decompile.yml'
      - 'tools/**'

permissions:
  contents: write

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      ver: ${{ steps.r.outputs.VER }}
      size: ${{ steps.g.outputs.BINSIZE }}
      url_hash: ${{ steps.uh.outputs.URL_HASH }}
    steps:
      - uses: actions/checkout@v4

      - id: uh
        run: |
          U="${{ inputs.url }}"
          H=$(echo -n "$U" | shasum -a 256 | awk '{print $1}')
          echo "URL_HASH=$H" >> "$GITHUB_OUTPUT"

      - id: r
        env:
          BINARY_URL: ${{ inputs.url }}
          RESOLVE_ONLY: '1'
        run: bash tools/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ipa_cache
          key: ipa-${{ steps.r.outputs.VER }}-${{ steps.uh.outputs.URL_HASH }}
          restore-keys: |
            ipa-${{ steps.r.outputs.VER }}-
            ipa-

      - id: g
        env:
          BINARY_URL: ${{ inputs.url }}
        run: bash tools/fetch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: brawl_bin
          retention-days: 30

  dump:
    needs: fetch
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      - run: |
          set -euo pipefail
          BIN=$(find bin -type f | head -1)
          test -s "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          BH=$(shasum -a 256 "$BIN" | awk '{print $1}')
          echo "BIN_HASH=$BH" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        id: decompile-cache
        with:
          path: |
            r2proj
            decompiled.c
          key: decompile-${{ env.BIN_HASH }}-${{ needs.fetch.outputs.url_hash }}
          restore-keys: |
            decompile-${{ env.BIN_HASH }}-

      - if: steps.decompile-cache.outputs.cache-hit != 'true'
        run: bash tools/r2setup.sh

      - if: steps.decompile-cache.outputs.cache-hit != 'true'
        env:
          PHASE: analyze
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decomp.sh

      - if: steps.decompile-cache.outputs.cache-hit != 'true'
        env:
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decomp.sh

      - if: ${{ inputs.extract_all != false }}
        run: |
          python3 tools/extract_all.py \
            --bin "$BIN" \
            --code decompiled.c \
            --out index_data \
            --ver "${{ needs.fetch.outputs.ver }}"

      - if: ${{ inputs.fingerprint != false }}
        run: |
          python3 tools/fingerprint.py \
            --code decompiled.c \
            --out index_data/fingerprints.json

      - if: ${{ inputs.reconstruct_classes != false }}
        run: |
          python3 tools/class_reconstructor.py \
            --index_dir index_data \
            --out index_data/classes.json

      - if: ${{ inputs.symbolize != false }}
        run: |
          python3 tools/symbolize.py \
            --index_dir index_data \
            --out_dir symbols_out

      - if: always()
        run: |
          {
            echo "### Dump & Indexing Summary (${{ needs.fetch.outputs.ver }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Cache Hit | ${{ steps.decompile-cache.outputs.cache-hit == 'true' }} |"
            echo "| Functions | $(jq '. | length' index_data/functions.json 2>/dev/null || echo 0) |"
            echo "| Strings | $(jq '. | length' index_data/strings.json 2>/dev/null || echo 0) |"
            echo "| Classes | $(jq '. | length' index_data/classes.json 2>/dev/null || echo 0) |"
            echo "| Symbols | $(jq '. | length' symbols_out/symbols.json 2>/dev/null || echo 0) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-dump-${{ needs.fetch.outputs.ver }}
          path: |
            index_data/
            symbols_out/
            decompiled.c
          retention-days: 30
          if-no-files-found: warn
