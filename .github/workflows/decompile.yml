name: decompile

on:
  workflow_dispatch:
    inputs:
      url:
        description: Google Drive link to the game binary
        default: ''
      seconds:
        description: total analysis budget in seconds
        default: '18000'
      format:
        description: 'expected binary format: auto, macho, elf32, elf64'
        default: auto

permissions:
  contents: read

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ver: ${{ steps.g.outputs.VER }}
      url_hash: ${{ steps.uh.outputs.URL_HASH }}
    steps:
      - uses: actions/checkout@v4

      - id: uh
        run: |
          U="${{ inputs.url || vars.BINARY_URL }}"
          H=$(echo -n "$U" | shasum -a 256 | awk '{print $1}')
          echo "URL_HASH=$H" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: bin_cache
          key: bin-${{ steps.uh.outputs.URL_HASH }}-${{ inputs.format || 'auto' }}

      - id: g
        env:
          BINARY_URL: ${{ inputs.url || vars.BINARY_URL }}
          EXPECT_FORMAT: ${{ inputs.format || 'auto' }}
        run: bash tools/fetch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: binary
          retention-days: 30

  dump:
    needs: fetch
    runs-on: ubuntu-latest
    outputs:
      bin_hash: ${{ steps.env.outputs.bin_hash }}
      scripts_hash: ${{ steps.env.outputs.scripts_hash }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      - id: env
        run: |
          set -euo pipefail
          BIN=$(find bin -type f | head -1)
          test -s "$BIN"
          cp "$BIN" binary
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          BH=$(shasum -a 256 "$BIN" | awk '{print $1}')
          echo "BIN_HASH=$BH" >> "$GITHUB_ENV"
          echo "bin_hash=$BH" >> "$GITHUB_OUTPUT"
          SH=$(find tools ghidra -type f \( -name '*.py' -o -name '*.sh' -o -name '*.java' \) -print0 | sort -z | xargs -0 cat | shasum -a 256 | awk '{print $1}')
          echo "SCRIPTS_HASH=$SH" >> "$GITHUB_ENV"
          echo "scripts_hash=$SH" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: |
            decompiled.c
            index_data/bin_hash.txt
            index_data/imports.json
            index_data/symbols.json
            index_data/funcs.json
            structs.h
          key: dump-${{ env.BIN_HASH }}-${{ env.SCRIPTS_HASH }}
          restore-keys: |
            dump-${{ env.BIN_HASH }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-12.1.4

      - id: state
        run: |
          code=missing
          sym=missing
          if [ -s decompiled.c ] && [ -s index_data/bin_hash.txt ] && [ "$(cat index_data/bin_hash.txt)" = "$BIN_HASH" ]; then code=ready; fi
          if [ "$code" != ready ] && [ -e decompiled.c ]; then
            echo "cache image mismatch, dropping restored dump"
            rm -f decompiled.c index_data/imports.json index_data/symbols.json index_data/funcs.json structs.h index_data/bin_hash.txt
          fi
          if [ "$code" = ready ] && [ -s index_data/imports.json ]; then sym=ready; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sym=$sym" >> "$GITHUB_OUTPUT"
          echo "cache dump=$code symbols=$sym"

      - if: ${{ steps.state.outputs.code != 'ready' || steps.state.outputs.sym != 'ready' }}
        run: bash tools/setup.sh

      - if: ${{ steps.state.outputs.sym != 'ready' }}
        env:
          PHASE: names
          BUDGET: '3600'
        run: bash tools/decompile.sh

      - if: ${{ steps.state.outputs.code != 'ready' }}
        env:
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decompile.sh

      - if: always()
        run: |
          test -s decompiled.c
          bodies=$(grep -c '^{$' decompiled.c || true)
          echo "decompiled.c: $(wc -c < decompiled.c | tr -d ' ') bytes, ${bodies:-0} function bodies"
          test "${bodies:-0}" -gt 0
          echo "$BIN_HASH" > index_data/bin_hash.txt

      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dump-state
          path: |
            decompiled.c
            index_data/bin_hash.txt
            index_data/imports.json
            index_data/symbols.json
            index_data/funcs.json
            structs.h
          retention-days: 3
          if-no-files-found: ignore

      - run: |
          python3 tools/unwind.py \
            --bin "$BIN" \
            --out index_data/unwind.json

      - run: |
          python3 tools/xrefs.py \
            --bin "$BIN" \
            --code decompiled.c \
            --names index_data/imports.json \
            --out index_data

      - run: |
          python3 tools/fields.py \
            --code decompiled.c \
            --out index_data/fields.json

      - run: |
          python3 tools/fingerprint.py \
            --code decompiled.c \
            --out index_data/fingerprints.json

      - run: |
          python3 tools/vtables.py \
            --bin "$BIN" \
            --index_dir index_data

      - run: |
          python3 tools/ctors.py \
            --bin "$BIN" \
            --index_dir index_data

      - run: |
          python3 tools/classes.py \
            --index_dir index_data \
            --out index_data/classes.json

      - run: |
          python3 tools/structs.py \
            --index_dir index_data \
            --out structs.h \
            --json index_data/structs.json

      - run: |
          python3 - <<'PY'
          import json
          rows = json.load(open('index_data/functions.json'))
          parsed = sum(1 for value in rows.values() if value.get('size_chars'))
          vtables = len(json.load(open('index_data/vtables.json')))
          strings = len(json.load(open('index_data/strings.json')))
          assert parsed > 1000 and vtables > 0 and strings > 0, (len(rows), parsed, vtables, strings)
          print(f'index ok: {len(rows)} functions, {parsed} parsed, {vtables} vtables, {strings} strings')
          PY

      - if: always()
        run: |
          count() {
            if [ -s "$1" ]; then
              jq '. | length' "$1" 2>/dev/null || echo "unreadable"
            else
              echo "missing"
            fi
          }
          {
            echo "### Dump & Indexing Summary (${{ needs.fetch.outputs.ver }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Cache | ${{ steps.cache-restore.outputs.cache-matched-key || 'none' }} |"
            echo "| Cached dump | ${{ steps.state.outputs.code }} |"
            echo "| decompiled.c | $(wc -c < decompiled.c 2>/dev/null | tr -d ' ' || echo 0) bytes |"
            echo "| Function bodies | $(grep -c '^{$' decompiled.c 2>/dev/null || echo 0) |"
            echo "| Functions | $(count index_data/functions.json) |"
            echo "| Strings | $(count index_data/strings.json) |"
            echo "| Classes | $(count index_data/classes.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main_binary-${{ needs.fetch.outputs.ver }}
          path: |
            index_data/
            decompiled.c
            binary
          retention-days: 30
          if-no-files-found: warn

  persist:
    needs: [fetch, dump]
    if: always() && needs.dump.outputs.bin_hash != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dump-state
          path: .

      - if: hashFiles('decompiled.c') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            decompiled.c
            index_data/bin_hash.txt
            index_data/imports.json
            index_data/symbols.json
            index_data/funcs.json
            structs.h
          key: dump-${{ needs.dump.outputs.bin_hash }}-${{ needs.dump.outputs.scripts_hash }}
