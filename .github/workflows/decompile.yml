name: decompile

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: total seconds for analyze + dump
        default: '18000'
      url:
        description: ipa url override
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/decompile.yml'
      - 'tools/**'

permissions:
  contents: write

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      ver: ${{ steps.r.outputs.VER }}
      size: ${{ steps.g.outputs.BINSIZE }}
    steps:
      - uses: actions/checkout@v4

      - id: r
        env:
          BINARY_URL: ${{ inputs.url }}
          RESOLVE_ONLY: '1'
        run: bash tools/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ipa_cache
          key: ipa-${{ steps.r.outputs.VER }}

      - id: g
        env:
          BINARY_URL: ${{ inputs.url }}
        run: bash tools/fetch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: brawl_bin
          retention-days: 30

  dump:
    needs: fetch
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - run: bash tools/r2setup.sh

      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      - run: |
          set -euo pipefail
          BIN=$(find bin -type f | head -1)
          test -s "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        id: p
        with:
          path: r2proj
          key: r2proj-${{ env.R2V }}-${{ needs.fetch.outputs.ver }}-${{ needs.fetch.outputs.size }}

      - if: steps.p.outputs.cache-hit != 'true'
        env:
          PHASE: analyze
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decomp.sh

      - uses: actions/cache/save@v4
        if: steps.p.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: r2proj
          key: r2proj-${{ env.R2V }}-${{ needs.fetch.outputs.ver }}-${{ needs.fetch.outputs.size }}

      - env:
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decomp.sh

      - run: |
          python3 tools/extract_all.py \
            --bin "$BIN" \
            --code decompiled.c \
            --out index_data \

      - run: |
          python3 tools/fingerprint.py \
            --code decompiled.c \
            --out index_data/fingerprints.json
            --ver "${{ needs.fetch.outputs.ver }}"

      - if: always()
        run: |
          {
            echo "### Complete (${{ needs.fetch.outputs.ver }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Functions | $(jq '. | length' index_data/functions.json 2>/dev/null || echo 0) |"
            echo "| Strings | $(jq '. | length' index_data/strings.json 2>/dev/null || echo 0) |"
            echo "| VTables | $(jq '. | length' index_data/vtables.json 2>/dev/null || echo 0) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dump-${{ needs.fetch.outputs.ver }}
          path: |
            index_data/
            decompiled.c
          retention-days: 30
          if-no-files-found: warn
