name: decompile

on:
  workflow_dispatch:
    inputs:
      url:
        description: direct archive or binary URL (any game)
        default: ''
      xrefs:
        description: extract functions, strings, xrefs, call graph and vtables
        type: boolean
        default: true
      fingerprint:
        description: extract structural fingerprints
        type: boolean
        default: true
      reconstruct_classes:
        description: reconstruct C++ classes
        type: boolean
        default: true
      seconds:
        description: total analysis budget in seconds
        default: '18000'
  push:
    branches: [main]
    paths:
      - '.github/workflows/decompile.yml'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      ver: ${{ steps.r.outputs.VER }}
      size: ${{ steps.g.outputs.BINSIZE }}
      url_hash: ${{ steps.uh.outputs.URL_HASH }}
    steps:
      - uses: actions/checkout@v4

      - id: uh
        run: |
          U="${{ inputs.url }}"
          H=$(echo -n "$U" | shasum -a 256 | awk '{print $1}')
          echo "URL_HASH=$H" >> "$GITHUB_OUTPUT"

      - id: r
        env:
          BINARY_URL: ${{ inputs.url || vars.BINARY_URL }}
          RESOLVE_ONLY: '1'
        run: bash tools/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ipa_cache
          key: ipa-${{ steps.r.outputs.VER }}-${{ steps.uh.outputs.URL_HASH }}
          restore-keys: |
            ipa-${{ steps.r.outputs.VER }}-
            ipa-

      - id: g
        env:
          BINARY_URL: ${{ inputs.url || vars.BINARY_URL }}
        run: bash tools/fetch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: binary
          retention-days: 30

  dump:
    needs: fetch
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      - run: |
          set -euo pipefail
          BIN=$(find bin -type f | head -1)
          test -s "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          BH=$(shasum -a 256 "$BIN" | awk '{print $1}')
          echo "BIN_HASH=$BH" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        id: decompile-cache
        with:
          path: |
            r2proj
            decompiled.c
          key: decompile-${{ env.BIN_HASH }}-${{ needs.fetch.outputs.url_hash }}
          restore-keys: |
            decompile-${{ env.BIN_HASH }}-

      - id: state
        run: |
          proj=missing
          code=missing
          if [ -s r2proj ]; then proj=ready; fi
          if [ -s decompiled.c ]; then code=ready; fi
          echo "proj=$proj" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "cache project=$proj dump=$code"

      - if: ${{ steps.state.outputs.proj != 'ready' || steps.state.outputs.code != 'ready' }}
        run: bash tools/setup.sh

      - if: ${{ steps.state.outputs.proj != 'ready' }}
        env:
          PHASE: analyze
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decompile.sh

      - if: ${{ steps.state.outputs.code != 'ready' }}
        env:
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decompile.sh

      - if: always()
        run: |
          test -s decompiled.c
          bodies=$(grep -c '^{$' decompiled.c || true)
          echo "decompiled.c: $(wc -c < decompiled.c | tr -d ' ') bytes, ${bodies:-0} function bodies"
          test "${bodies:-0}" -gt 0

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.xrefs }}
        run: |
          python3 tools/xrefs.py \
            --bin "$BIN" \
            --code decompiled.c \
            --out index_data

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.xrefs }}
        run: |
          python3 tools/vtables.py \
            --bin "$BIN" \
            --index_dir index_data

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.fingerprint }}
        run: |
          python3 tools/fingerprint.py \
            --code decompiled.c \
            --out index_data/fingerprints.json

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.reconstruct_classes }}
        run: |
          python3 tools/classes.py \
            --index_dir index_data \
            --out index_data/classes.json

      - if: always()
        run: |
          count() {
            if [ -s "$1" ]; then
              jq '. | length' "$1" 2>/dev/null || echo "unreadable"
            else
              echo "missing"
            fi
          }
          {
            echo "### Dump & Indexing Summary (${{ needs.fetch.outputs.ver }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Cache Hit | ${{ steps.decompile-cache.outputs.cache-hit == 'true' }} |"
            echo "| Cached project | ${{ steps.state.outputs.proj }} |"
            echo "| Cached dump | ${{ steps.state.outputs.code }} |"
            echo "| decompiled.c | $(wc -c < decompiled.c 2>/dev/null | tr -d ' ' || echo 0) bytes |"
            echo "| Function bodies | $(grep -c '^{$' decompiled.c 2>/dev/null || echo 0) |"
            echo "| Functions | $(count index_data/functions.json) |"
            echo "| Strings | $(count index_data/strings.json) |"
            echo "| Classes | $(count index_data/classes.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main_binary-${{ needs.fetch.outputs.ver }}
          path: |
            index_data/
            decompiled.c
          retention-days: 30
          if-no-files-found: warn
