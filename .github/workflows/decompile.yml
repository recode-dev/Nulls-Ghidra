name: decompile

on:
  workflow_dispatch:
    inputs:
      url:
        description: direct archive or binary URL (any game)
        default: ''
      diff_offsets_url:
        description: URL or raw text of a reference offsets map (C / JS / TS / JSON)
        default: ''
      reference_url:
        description: URL of a reference build (APK / IPA / zip / ELF or Mach-O) to decompile alongside the target
        default: ''
      symbolize:
        description: generate IDA / Ghidra / radare2 symbol maps
        type: boolean
        default: true
      extract_all:
        description: extract strings, xrefs, and call graphs
        type: boolean
        default: true
      fingerprint:
        description: extract structural fingerprints
        type: boolean
        default: true
      reconstruct_classes:
        description: reconstruct C++ classes
        type: boolean
        default: true
      seconds:
        description: total analysis budget in seconds
        default: '18000'
  push:
    branches: [main]
    paths:
      - '.github/workflows/decompile.yml'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      ver: ${{ steps.r.outputs.VER }}
      size: ${{ steps.g.outputs.BINSIZE }}
      url_hash: ${{ steps.uh.outputs.URL_HASH }}
    steps:
      - uses: actions/checkout@v4

      - id: uh
        run: |
          U="${{ inputs.url }}"
          H=$(echo -n "$U" | shasum -a 256 | awk '{print $1}')
          echo "URL_HASH=$H" >> "$GITHUB_OUTPUT"

      - id: r
        env:
          BINARY_URL: ${{ inputs.url || vars.BINARY_URL }}
          RESOLVE_ONLY: '1'
        run: bash tools/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ipa_cache
          key: ipa-${{ steps.r.outputs.VER }}-${{ steps.uh.outputs.URL_HASH }}
          restore-keys: |
            ipa-${{ steps.r.outputs.VER }}-
            ipa-

      - id: g
        env:
          BINARY_URL: ${{ inputs.url || vars.BINARY_URL }}
        run: bash tools/fetch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: binary
          retention-days: 30

  dump:
    needs: fetch
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      - run: |
          set -euo pipefail
          BIN=$(find bin -type f | head -1)
          test -s "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          BH=$(shasum -a 256 "$BIN" | awk '{print $1}')
          echo "BIN_HASH=$BH" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        id: decompile-cache
        with:
          path: |
            r2proj
            decompiled.c
          key: decompile-${{ env.BIN_HASH }}-${{ needs.fetch.outputs.url_hash }}
          restore-keys: |
            decompile-${{ env.BIN_HASH }}-

      - id: state
        run: |
          proj=missing
          code=missing
          if [ -s r2proj ]; then proj=ready; fi
          if [ -s decompiled.c ]; then code=ready; fi
          echo "proj=$proj" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "cache project=$proj dump=$code"

      - if: ${{ steps.state.outputs.proj != 'ready' || steps.state.outputs.code != 'ready' }}
        run: bash tools/r2setup.sh

      - if: ${{ steps.state.outputs.proj != 'ready' }}
        env:
          PHASE: analyze
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decomp.sh

      - if: ${{ steps.state.outputs.code != 'ready' }}
        env:
          BUDGET: ${{ inputs.seconds || '18000' }}
        run: bash tools/decomp.sh

      - if: always()
        run: |
          test -s decompiled.c
          bodies=$(grep -c '^{$' decompiled.c || true)
          echo "decompiled.c: $(wc -c < decompiled.c | tr -d ' ') bytes, ${bodies:-0} function bodies"
          test "${bodies:-0}" -gt 0

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.extract_all }}
        run: |
          python3 tools/extract_all.py \
            --bin "$BIN" \
            --code decompiled.c \
            --out index_data \
            --ver "${{ needs.fetch.outputs.ver }}"

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.fingerprint }}
        run: |
          python3 tools/fingerprint.py \
            --code decompiled.c \
            --out index_data/fingerprints.json

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.reconstruct_classes }}
        run: |
          python3 tools/class_reconstructor.py \
            --index_dir index_data \
            --out index_data/classes.json

      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.symbolize }}
        run: |
          python3 tools/symbolize.py \
            --index_dir index_data \
            --out_dir symbols_out

      - if: ${{ inputs.diff_offsets_url != '' }}
        run: |
          python3 tools/diff_versions.py \
            --old_offsets "${{ inputs.diff_offsets_url }}" \
            --new_index index_data \
            --out "offsets_${{ needs.fetch.outputs.ver }}.js" \
            --out_md Diffed_Offsets.md

      - run: |
          python3 tools/search.py --index_dir index_data --role root_update_loop 2>/dev/null | head -5 || true
          python3 tools/search.py --index_dir index_data --field 0x8 | head -5 || true

      - if: ${{ inputs.diff_offsets_url != '' }}
        run: |
          python3 tools/offset_finder.py \
            --names "${{ inputs.diff_offsets_url }}" \
            --binary "$BIN" \
            --index_dir index_data \
            --code decompiled.c \
            --report resolution_report.md \
            --out resolved_offsets.js

      - if: ${{ inputs.diff_offsets_url != '' }}
        run: |
          python3 tools/verify_offsets.py \
            --resolved resolved_offsets.js \
            --index_dir index_data \
            --out verified_offsets.md
          cat verified_offsets.md >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: |
          count() {
            if [ -s "$1" ]; then
              jq '. | length' "$1" 2>/dev/null || echo "unreadable"
            else
              echo "missing"
            fi
          }
          {
            echo "### Dump & Indexing Summary (${{ needs.fetch.outputs.ver }})"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Cache Hit | ${{ steps.decompile-cache.outputs.cache-hit == 'true' }} |"
            echo "| Cached project | ${{ steps.state.outputs.proj }} |"
            echo "| Cached dump | ${{ steps.state.outputs.code }} |"
            echo "| decompiled.c | $(wc -c < decompiled.c 2>/dev/null | tr -d ' ' || echo 0) bytes |"
            echo "| Function bodies | $(grep -c '^{$' decompiled.c 2>/dev/null || echo 0) |"
            echo "| Functions | $(count index_data/functions.json) |"
            echo "| Strings | $(count index_data/strings.json) |"
            echo "| Classes | $(count index_data/classes.json) |"
            echo "| Symbols | $(count symbols_out/symbols.json) |"
            if [ -f resolution_report.md ]; then
              echo "### Offset resolution (binary validated)"
              grep -E '^- |^\*\*' resolution_report.md | tail -8
            fi
            if [ -f Diffed_Offsets.md ]; then
              echo "### Auto Diffed Offsets"
              cat Diffed_Offsets.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-dump-${{ needs.fetch.outputs.ver }}
          path: |
            index_data/
            symbols_out/
            Diffed_Offsets.md
            resolution_report.md
            resolved_offsets.js
            offsets_*.js
            decompiled.c
          retention-days: 30
          if-no-files-found: warn

  ref_dump:
    if: ${{ inputs.reference_url != '' }}
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: fetch and extract reference binary
        env:
          BINARY_URL: ${{ inputs.reference_url }}
          OUT_BIN: ref_binary
          IPA_CACHE_DIR: ref_ipa_cache
          EXTRACT_DIR: ref_extract
          VERSION_FILE: ref_version.txt
        run: bash tools/fetch.sh

      - run: bash tools/r2setup.sh

      - name: decompile reference
        env:
          BIN: ref_binary
          BUDGET: ${{ inputs.seconds || '18000' }}
          R2PROJ: ref_r2proj
          CODE_OUT: ref_decompiled.c
          META_OUT: ref_functions.json
          ENGINE_OUT: ref_engine.txt
          R2_LOG: ref_r2.log
        run: |
          PHASE=analyze bash tools/decomp.sh
          bash tools/decomp.sh

      - name: check reference output
        run: |
          test -s ref_decompiled.c
          echo "ref decompiled.c: $(wc -c < ref_decompiled.c | tr -d ' ') bytes, $(grep -c '^{$' ref_decompiled.c || true) function bodies"

      - uses: actions/upload-artifact@v4
        with:
          name: ref-decompile
          path: |
            ref_decompiled.c
            ref_functions.json
            ref_version.txt
